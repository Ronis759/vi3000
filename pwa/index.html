<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0e">
  <title>VI3000</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0b0b0e;
      color: #f5f5f7;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    #screen {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      border: 0;
      display: block;
      background: #0b0b0e;
    }
    #loading {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 18px;
      background: #0b0b0e;
      z-index: 2;
      transition: opacity .25s ease;
    }
    #loading.hidden { opacity: 0; pointer-events: none; }
    #loading img { width: 96px; height: 96px; }
    #loading p { margin: 0; opacity: .7; font-size: 16px; }
    #fallback {
      position: fixed;
      left: 50%;
      bottom: 24px;
      transform: translateX(-50%);
      z-index: 3;
      display: none;
      padding: 12px 20px;
      border: 1px solid #3a3a42;
      border-radius: 10px;
      background: #17171c;
      color: #f5f5f7;
      font-size: 15px;
      text-decoration: none;
    }
    #fallback:hover, #fallback:focus { border-color: #f5a623; outline: 2px solid #f5a623; }
  </style>
</head>
<body>
  <div id="loading">
    <img src="./icons/icon-192.png" alt="VI3000">
    <p>Завантаження VI3000…</p>
  </div>

  <iframe
    id="screen"
    src="https://vi3000.top/"
    title="VI3000"
    allow="fullscreen; autoplay; encrypted-media; picture-in-picture; geolocation"
    allowfullscreen
    referrerpolicy="no-referrer-when-downgrade">
  </iframe>

  <a id="fallback" href="https://vi3000.top/" target="_blank" rel="noopener">Відкрити vi3000.top у браузері</a>

  <script>
    (function () {
      var frame = document.getElementById('screen');
      var loading = document.getElementById('loading');
      var fallback = document.getElementById('fallback');
      var ready = false;

      function showReady() {
        if (ready) return;
        ready = true;
        loading.classList.add('hidden');
        setTimeout(function () { loading.remove(); }, 400);
        try { frame.contentWindow.focus(); } catch (e) {}
      }

      frame.addEventListener('load', function () {
        showReady();
        try { frame.contentWindow.focus(); } catch (e) {}
      });

      // Если сайт не открылся в iframe, даём обычную ссылку.
      setTimeout(function () {
        if (!ready) {
          fallback.style.display = 'block';
          loading.querySelector('p').textContent = 'Не вдалося завантажити сайт у вікні.';
        }
      }, 12000);

      // Возвращаем фокус в сайт, если он ушёл на оболочку (пульт/клавиатура).
      document.addEventListener('keydown', function (event) {
        if (document.activeElement === frame) return;
        var keys = [37, 38, 39, 40, 13, 461, 8];
        if (keys.indexOf(event.keyCode) >= 0) {
          try { frame.contentWindow.focus(); } catch (e) {}
        }
      });

      if ('serviceWorker' in navigator) {
        window.addEventListener('load', function () {
          navigator.serviceWorker.register('./sw.js').catch(function () {});
        });
      }
    })();
  </script>
</body>
</html>
